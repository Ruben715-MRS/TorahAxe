<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="Schéma : les quatre pièces de l’affaire Dreyfus, qui les a écrites et ce qu’elles prouvaient">
<rect width="900" height="640" fill="#F2EADB"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#6B5F55"/></marker></defs>
<rect x="30" y="60" width="400" height="160" rx="8" fill="#FBF7EF" stroke="#B3362B" stroke-width="2.5"/>
<rect x="30" y="60" width="400" height="34" rx="8" fill="#B3362B"/>
<rect x="30" y="80" width="400" height="14" fill="#B3362B"/>
<text x="42" y="83" font-size="17" font-weight="bold" fill="#fff">Le bordereau</text>
<text x="418" y="83" font-size="14" fill="#fff" text-anchor="end">septembre 1894</text>
<text x="42" y="118" font-size="14.5" fill="#2B2420">Lettre non signée trouvée dans une corbeille</text>
<text x="42" y="139" font-size="14.5" fill="#2B2420">de l’ambassade d’Allemagne.</text>
<text x="42" y="160" font-size="14.5" fill="#2B2420">Écrite par : le commandant Esterhazy.</text>
<text x="42" y="181" font-size="14.5" fill="#2B2420">Attribuée à : Dreyfus.</text>
<text x="42" y="202" font-size="14.5" fill="#6B5F55" font-style="italic">La trahison était réelle ; le coupable, un autre.</text>
<rect x="470" y="60" width="400" height="160" rx="8" fill="#FBF7EF" stroke="#B3362B" stroke-width="2.5"/>
<rect x="470" y="60" width="400" height="34" rx="8" fill="#B3362B"/>
<rect x="470" y="80" width="400" height="14" fill="#B3362B"/>
<text x="482" y="83" font-size="17" font-weight="bold" fill="#fff">Le dossier secret</text>
<text x="858" y="83" font-size="14" fill="#fff" text-anchor="end">décembre 1894</text>
<text x="482" y="118" font-size="14.5" fill="#2B2420">Pièces montrées aux juges en cachette,</text>
<text x="482" y="139" font-size="14.5" fill="#2B2420">sans que la défense les voie.</text>
<text x="482" y="160" font-size="14.5" fill="#2B2420">Aucune ne désigne vraiment Dreyfus :</text>
<text x="482" y="181" font-size="14.5" fill="#2B2420">« ce canaille de D… » visait un autre.</text>
<text x="482" y="202" font-size="14.5" fill="#6B5F55" font-style="italic">Une illégalité qui rendra le procès nul.</text>
<rect x="30" y="330" width="400" height="160" rx="8" fill="#FBF7EF" stroke="#2F5D9A" stroke-width="2.5"/>
<rect x="30" y="330" width="400" height="34" rx="8" fill="#2F5D9A"/>
<rect x="30" y="350" width="400" height="14" fill="#2F5D9A"/>
<text x="42" y="353" font-size="17" font-weight="bold" fill="#fff">Le « petit bleu »</text>
<text x="418" y="353" font-size="14" fill="#fff" text-anchor="end">mars 1896</text>
<text x="42" y="388" font-size="14.5" fill="#2B2420">Carte-télégramme de l’attaché allemand</text>
<text x="42" y="409" font-size="14.5" fill="#2B2420">Schwartzkoppen à Esterhazy, déchirée.</text>
<text x="42" y="430" font-size="14.5" fill="#2B2420">Trouvée par : le colonel Picquart.</text>
<text x="42" y="451" font-size="14.5" fill="#2B2420">Son écriture mène Picquart au bordereau.</text>
<text x="42" y="472" font-size="14.5" fill="#6B5F55" font-style="italic">La première piste vers le vrai traître.</text>
<rect x="470" y="330" width="400" height="160" rx="8" fill="#FBF7EF" stroke="#B3362B" stroke-width="2.5"/>
<rect x="470" y="330" width="400" height="34" rx="8" fill="#B3362B"/>
<rect x="470" y="350" width="400" height="14" fill="#B3362B"/>
<text x="482" y="353" font-size="17" font-weight="bold" fill="#fff">Le « faux Henry »</text>
<text x="858" y="353" font-size="14" fill="#fff" text-anchor="end">novembre 1896</text>
<text x="482" y="388" font-size="14.5" fill="#2B2420">Fausse lettre d’un attaché italien</text>
<text x="482" y="409" font-size="14.5" fill="#2B2420">qui nomme Dreyfus en toutes lettres.</text>
<text x="482" y="430" font-size="14.5" fill="#2B2420">Fabriquée par : le commandant Henry.</text>
<text x="482" y="451" font-size="14.5" fill="#2B2420">Découverte : août 1898. Henry avoue</text>
<text x="482" y="472" font-size="14.5" fill="#6B5F55" font-style="italic">et meurt en prison le lendemain.</text>
<line x1="430" y1="140" x2="470" y2="140" stroke="#6B5F55" stroke-width="2" marker-end="url(#ar)"/>
<line x1="230" y1="330" x2="230" y2="220" stroke="#6B5F55" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="410" x2="470" y2="410" stroke="#6B5F55" stroke-width="2" marker-end="url(#ar)"/>
<text x="240.0" y="282.0" font-size="13" fill="#6B5F55" text-anchor="start" font-weight="normal" font-style="italic">Picquart compare les écritures (août 1896)</text>
<text x="450.0" y="520.0" font-size="13" fill="#6B5F55" text-anchor="middle" font-weight="normal" font-style="italic">pour contrer Picquart</text>
<text x="450.0" y="250.0" font-size="13" fill="#6B5F55" text-anchor="middle" font-weight="normal" font-style="italic">pour renforcer l’accusation</text>
<text x="450.0" y="36.0" font-size="20" fill="#2B2420" text-anchor="middle" font-weight="bold" font-style="normal">Les quatre pièces de l’Affaire</text>
<rect x="30" y="540" width="22" height="14" fill="#B3362B"/>
<text x="62.0" y="552.0" font-size="14" fill="#2B2420" text-anchor="start" font-weight="normal" font-style="normal">pièces qui ont servi à accuser Dreyfus</text>
<rect x="30" y="566" width="22" height="14" fill="#2F5D9A"/>
<text x="62.0" y="578.0" font-size="14" fill="#2B2420" text-anchor="start" font-weight="normal" font-style="normal">pièce qui a mis sur la piste de la vérité</text>
<text x="880.0" y="624.0" font-size="12" fill="#6B5F55" text-anchor="end" font-weight="normal" font-style="italic">Schéma HistoriAxe</text>
</svg>
